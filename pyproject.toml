[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "tf-iam-scope"
version = "0.1.0"
description = "AWS Terraform CI/CD IAM permission analyzer"
requires-python = ">=3.10"
dependencies = ["python-hcl2>=7,<8", "jsonschema>=4.22,<5"]
[project.optional-dependencies]
test = ["pytest>=8"]
aws = ["boto3>=1.34,<2"]
packaging = ["pyinstaller>=6,<7"]
[project.scripts]
tfiam = "tfiam.cli:main"
[tool.setuptools.packages.find]
include = ["tfiam*"]

[tool.setuptools.package-data]
tfiam = ["catalog/*.json"]
