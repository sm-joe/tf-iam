[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "tf-iam-scope"
version = "0.1.0"
description = "Offline Terraform deployment IAM permission analyzer"
requires-python = ">=3.10"
dependencies = ["python-hcl2>=7,<8"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
tfiam = "tfiam.cli:main"
[tool.setuptools.packages.find]
include = ["tfiam*"]
