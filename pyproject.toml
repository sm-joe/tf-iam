[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"
[project]
name = "tf-iam"
version = "1.1.0"
description = "AWS Terraform CI/CD IAM permission analyzer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["python-hcl2>=7,<8", "jsonschema>=4.22,<5"]
[project.urls]
Repository = "https://github.com/sm-joe/tf-iam"
Issues = "https://github.com/sm-joe/tf-iam/issues"
[project.optional-dependencies]
test = ["pytest>=8"]
aws = ["boto3>=1.34,<2"]
packaging = ["pyinstaller>=6,<7"]
[project.scripts]
tfiam = "tfiam.cli:main"
[tool.setuptools]
packages = ["tfiam"]
include-package-data = true

[tool.setuptools.package-data]
tfiam = ["catalog/*.json", "catalog/authorization/*.json"]
