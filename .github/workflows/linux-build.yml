name: Linux binary build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test,aws,packaging]'
      - run: python -m pytest -q
      - run: python scripts/prepare-metadata.py
      - run: bash scripts/build-linux.sh
      - run: |
          dist/tfiam --help
          dist/tfiam catalog-audit --strict --format json
          dist/tfiam scan examples/aws-hcl --format json > "$RUNNER_TEMP/offline-scan.json"
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["authorization_metadata"]["metadata_source"]=="packaged"' "$RUNNER_TEMP/offline-scan.json"
          (
            cd examples/networking-18
            AWS_ACCOUNT_ID=123456789012 AWS_REGION=us-east-1 ../../dist/tfiam generate . --output "$RUNNER_TEMP/network-policy.json"
          )
          python -c 'import json,sys; p=json.load(open(sys.argv[1])); a={a for s in p["Statement"] for a in s["Action"]}; assert {"ec2:CreateVpc","ec2:CreateSubnet","ec2:CreateNatGateway","ec2:CreateVpcEndpoint","ec2:CreateVpcPeeringConnection","route53:ChangeResourceRecordSets"} <= a' "$RUNNER_TEMP/network-policy.json"
          python - "$RUNNER_TEMP/network-policy.json" <<'PY'
          import json
          import sys

          policy=json.load(open(sys.argv[1]))
          actions={a for row in policy["Statement"] for a in row["Action"]}
          assert "ec2:CreateTags" in actions
          # All fixture resource tags are the Name authorization anchor:
          # post-create DeleteTags must not be granted on that anchor.
          assert "ec2:DeleteTags" not in actions
          destructive={
              "ec2:DeleteVpc","ec2:DeleteSubnet","ec2:DeleteNatGateway",
              "ec2:DeleteNetworkAcl","ec2:DeleteRouteTable",
              "ec2:DeleteSecurityGroup","ec2:DeleteTransitGateway",
              "ec2:DeleteVpcEndpoints","ec2:DeleteVpcPeeringConnection",
          }
          for statement in policy["Statement"]:
              condition=statement.get("Condition",{})
              strings=condition.get("StringEquals",{})
              if destructive.intersection(statement["Action"]):
                  assert "ec2:ResourceTag/Name" in strings,statement
              if {"ec2:CreateTags","ec2:DeleteTags"}.intersection(statement["Action"]):
                  assert "ec2:CreateAction" in strings or "ec2:ResourceTag/Name" in strings,statement
                  assert condition["ForAllValues:StringEquals"]["aws:TagKeys"],statement
                  assert condition["Null"]=={"aws:TagKeys":"false"},statement
          # Existing-resource tag operations must not mutate the key that
          # authorizes their own resource selection.
          for statement in policy["Statement"]:
              cond=statement.get("Condition",{})
              strings=cond.get("StringEquals",{})
              keys=cond.get("ForAllValues:StringEquals",{}).get("aws:TagKeys",[])
              for key in ("tfiam:scope","Name"):
                  if "ec2:ResourceTag/"+key in strings and (
                      {"ec2:CreateTags","ec2:DeleteTags"} & set(statement["Action"])):
                      assert key not in keys, statement
          print("PASS: source-only IAM cannot retag its own authorization anchor")
          print("PASS: packaged IAM policy retains bounded EC2 tagging and destruction")
          PY
          dist/tfiam pack-policy "$RUNNER_TEMP/network-policy.json" \
            --output-dir "$RUNNER_TEMP/network-policy-bundle" \
            --max-policies 10 > "$RUNNER_TEMP/network-bundle-manifest.json"
          python - "$RUNNER_TEMP/network-policy.json" "$RUNNER_TEMP/network-policy-bundle" <<'PY'
          import json
          import sys
          from pathlib import Path
          from tfiam.policy_size import grants, size

          original=json.loads(Path(sys.argv[1]).read_text())
          folder=Path(sys.argv[2])
          manifest=json.loads((folder/"manifest.json").read_text())
          assert manifest["policy_count"]>=1
          assert manifest["policy_count"]<=10
          assert len(manifest["policies"])==manifest["policy_count"]
          recovered=set()
          for item in manifest["policies"]:
              packed=json.loads((folder/item["file"]).read_text())
              assert size(packed)==item["characters"]
              assert size(packed)<=6144
              recovered.update(grants(packed))
          assert recovered==grants(original),("Grant union changed during IAM partition",len(recovered),len(grants(original)))
          # A single document for applications, plus readable standalone IAM JSON.
          bundle=json.loads((folder/"bundle.json").read_text())
          assert len(bundle["policies"])==manifest["policy_count"]
          bundle_grants=set()
          for entry in bundle["policies"]:
              assert entry["document"]["Version"]=="2012-10-17"
              bundle_grants.update(grants(entry["document"]))
          assert bundle_grants==grants(original)
          for item in manifest["policies"]:
              file_text=(folder/item["file"]).read_text()
              assert len(file_text.splitlines())>5
              assert json.loads(file_text)["Version"]=="2012-10-17"
          print("PASS: packaged IAM bundle fits AWS managed-policy limits with exactly equivalent grants")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tfiam-linux-x86_64
          path: |
            dist/tfiam
            dist/SHA256SUMS
