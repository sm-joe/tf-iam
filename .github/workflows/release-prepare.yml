name: Prepare signed Linux release
on:
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: "Trusted run ID containing reviewed release-evidence artifact"
        required: true
        type: string
      evidence_artifact:
        description: "Artifact containing manifest.json and referenced files"
        required: true
        default: release-evidence
        type: string
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.evidence_artifact }}
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-evidence
      - name: Check acceptance evidence
        run: python scripts/check-release.py "$RUNNER_TEMP/release-evidence/manifest.json" --expected-commit "$GITHUB_SHA"
      - run: python -m pip install '.[test,aws,packaging]'
      - run: python -m pytest -q
      - name: Build and verify repeatability
        run: |
          bash scripts/build-linux.sh
          cp dist/tfiam "$RUNNER_TEMP/tfiam-first"
          bash scripts/build-linux.sh
          cmp "$RUNNER_TEMP/tfiam-first" dist/tfiam
          (cd dist && sha256sum -c SHA256SUMS)
          dist/tfiam --help
          dist/tfiam scan examples/aws-hcl --format json
      - name: Attest release artifact
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/tfiam
      - uses: actions/upload-artifact@v4
        with:
          name: tfiam-linux-x86_64-release
          path: |
            dist/tfiam
            dist/SHA256SUMS
